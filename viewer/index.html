<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font: 14px sans-serif; }
#bar { position: absolute; z-index: 2; left: 8px; top: 8px; }
button { margin-right: 6px; padding: 6px 10px; }
#stage { position: absolute; inset: 0; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="bar">
<button id="wire" type="button">Wire</button>
</div>
<div id="stage"></div>
<script type="importmap">
{"imports":{
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

const stage = document.getElementById("stage");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const cam = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.toneMapping = THREE.NoToneMapping;
ren.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
stage.appendChild(ren.domElement);
const ctl = new OrbitControls(cam, ren.domElement);
ctl.enableDamping = true;
ctl.enableZoom = false;
ctl.target.set(0, 0, 0);
ren.domElement.addEventListener("wheel", (e) => {
  e.preventDefault();
  const ticks = Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY) / 100, 1);
  if (!ticks) return;
  const dist = cam.position.distanceTo(ctl.target);
  const next = dist * Math.pow(1.12, ticks);
  const clamped = Math.min(ctl.maxDistance, Math.max(ctl.minDistance, next));
  cam.position.copy(ctl.target).add(
    cam.position.clone().sub(ctl.target).normalize().multiplyScalar(clamped)
  );
}, { passive: false });
scene.add(new THREE.AmbientLight(0xffffff, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(2, 3, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.9);
fill.position.set(-2, -1, -2);
scene.add(fill);

function resize() {
  const w = stage.clientWidth || window.innerWidth || 640;
  const h = stage.clientHeight || window.innerHeight || 640;
  if (w < 2 || h < 2) return;
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
  ren.setSize(w, h, false);
}
new ResizeObserver(resize).observe(stage);
resize();

let root = null;
let wire = false;
function frame(g) {
  const box = new THREE.Box3().setFromObject(g);
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.length(), 1e-4);
  g.position.sub(box.getCenter(new THREE.Vector3()));
  cam.near = radius * 0.001;
  cam.far = radius * 50;
  cam.updateProjectionMatrix();
  ctl.minDistance = radius * 0.15;
  ctl.maxDistance = radius * 8;
  cam.position.set(0, radius * 0.15, radius * 1.35);
  ctl.target.set(0, 0, 0);
  ctl.update();
  resize();
}

async function exists(name) {
  const r = await fetch(name, { method: "HEAD" });
  return r.ok;
}
const objName = (await exists("color.obj")) ? "color.obj" : "quad.obj";
new OBJLoader().load(objName, (g) => {
  g.traverse((o) => {
    if (!o.isMesh) return;
    const hasColor = !!(o.geometry && o.geometry.getAttribute("color"));
    o.material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      vertexColors: hasColor,
      side: THREE.DoubleSide,
      metalness: 0,
      roughness: 0.55,
      wireframe: wire,
    });
  });
  scene.add(g);
  root = g;
  frame(g);
});

document.getElementById("wire").onclick = () => {
  wire = !wire;
  if (!root) return;
  root.traverse((o) => { if (o.isMesh) o.material.wireframe = wire; });
};
addEventListener("resize", resize);
(function loop() {
  requestAnimationFrame(loop);
  ctl.update();
  ren.render(scene, cam);
})();
</script>
</body>
</html>
